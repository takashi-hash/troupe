[project]
name = "ichiza"
version = "0.1.0"
description = "一座 — AI が仕事を回し、判断は人間が持つ仕事場"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "import-linter>=2.0"]

[tool.pyright]
include = ["domain", "app", "adapters", "ui", "tests", "main.py"]
strict = ["domain", "app"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# 依存は内向きのみ（設計/どう作るか §4）
[tool.importlinter]
root_packages = ["domain", "app", "adapters", "ui"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "依存は内向きのみ"
type = "layers"
layers = ["ui", "adapters", "app", "domain"]

[[tool.importlinter.contracts]]
name = "domain は外の道具を知らない"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["app", "adapters", "ui", "sqlite3", "urllib", "random"]

[[tool.importlinter.contracts]]
name = "ui は domain を知らない"
type = "forbidden"
source_modules = ["ui"]
forbidden_modules = ["domain"]
