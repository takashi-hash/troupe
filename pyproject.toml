[project]
name = "ichiza"
version = "0.1.0"
description = "一座 — AI が仕事を回し、判断は人間が持つ仕事場"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "google-genai>=1.0"]

# 器と帳簿は差し替わる——載せる先で要るものだけを入れる。
# 机の窓には PySide6、web の窓には FastAPI、クラウドの帳簿には psycopg。
[project.optional-dependencies]
desktop = ["pyside6>=6.7"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
cloud = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "pyside6>=6.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[tool.pyright]
include = ["domain", "app", "adapters", "ui", "main.py", "tests"]
strict = ["domain", "app"]
reportMissingTypeStubs = false
# pyright は pydantic の frozen を hashable と見ない（明示した __hash__ も見ない）。
# 値オブジェクトはすべて frozen なので、この規則はここでは必ず偽陽性になる。
# **実物は tests が確かめる**——道具の見落としに合わせて義務の側を曲げない。
reportUnhashable = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["domain", "app", "adapters", "ui"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "依存は内向きのみ"
type = "layers"
layers = ["ui | adapters", "app", "domain"]

# 画面は中心の形を知らない——届くのは文字と ID だけ
[[tool.importlinter.contracts]]
name = "ui は domain を知らない"
type = "forbidden"
source_modules = ["ui"]
forbidden_modules = ["domain"]

# domain の中も依存は内向き。出来事と仕様は互いを知らない。
[[tool.importlinter.contracts]]
name = "domain の中の層"
type = "layers"
layers = ["domain.aggregates", "domain.events | domain.services", "domain.value_objects", "domain.obligations"]

# 集約の境界。仕事は版から**写す**——だから import はこの一方向にしか流れない。
[[tool.importlinter.contracts]]
name = "業務ルールは仕事を知らない（値）"
type = "layers"
layers = ["domain.value_objects.job", "domain.value_objects.rule", "domain.value_objects.calendar | domain.value_objects.people", "domain.obligations"]

[[tool.importlinter.contracts]]
name = "業務ルールは仕事を知らない（集約と出来事）"
type = "forbidden"
source_modules = ["domain.aggregates.rule", "domain.events.rule"]
forbidden_modules = ["domain.aggregates.job", "domain.events.job", "domain.value_objects.job"]

[[tool.importlinter.contracts]]
name = "domain は外の道具を知らない"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["sqlite3", "urllib", "random", "os", "time"]
