<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      .t   { fill:#11161d; font-size:15px; }
      .lbl { fill:#5b6470; font-size:12px; letter-spacing:.09em; text-transform:uppercase; }
      .sm  { fill:#5b6470; font-size:12.5px; }
      .h1  { fill:#11161d; font-size:26px; font-weight:700; }
      .h2  { fill:#11161d; font-size:16.5px; font-weight:650; }
      .mono{ font-family:'SF Mono', ui-monospace, Menlo, monospace; font-size:12.5px; fill:#11161d; }
      .box { fill:#ffffff; stroke:#c9d0d8; stroke-width:1.3; }
      .gcp { fill:#f2f6fc; stroke:#a9c2e8; stroke-width:1.3; }
      .swap{ fill:#fff5ed; stroke:#e8935c; stroke-width:1.8; }
      .core{ fill:#f6f4ef; stroke:#cfc7b6; stroke-width:1.3; }
      .human{ fill:#eef7f0; stroke:#8cbf9a; stroke-width:1.8; }
      .flow{ stroke:#5b6470; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .warm{ stroke:#c2410c; stroke-width:1.7; fill:none; marker-end:url(#aw); }
    </style>
  </defs>

  <rect width="1440" height="940" fill="#fbfbfa"/>

  <text x="56" y="58" class="h1">Troupe</text>
  <text x="164" y="58" class="t" fill="#5b6470">an autonomous agent that runs a home-care agency's recurring compliance work</text>
  <text x="56" y="86" class="sm">The AI does the work. Approving, sending back, answering and abandoning stay with a person — there is no code path from the agent to any of them.</text>

  <!-- ============ Google Cloud ============ -->
  <rect x="56" y="122" width="700" height="516" rx="14" class="gcp"/>
  <text x="80" y="152" class="lbl">Google Cloud · project ichiza-agentic · asia-northeast1</text>

  <!-- Scheduler -->
  <rect x="80" y="176" width="176" height="128" rx="10" class="swap"/>
  <text x="96" y="202" class="h2">Cloud Scheduler</text>
  <text x="96" y="224" class="sm">two beats, every 60s</text>
  <text x="96" y="256" class="mono">* * * * *</text>
  <text x="96" y="284" class="sm" fill="#c2410c">replaced macOS launchd</text>

  <!-- tick job -->
  <rect x="304" y="176" width="200" height="58" rx="10" class="box"/>
  <text x="320" y="200" class="h2">Cloud Run Job</text>
  <text x="320" y="222" class="mono">troupe-tick</text>

  <!-- agent job -->
  <rect x="304" y="246" width="200" height="58" rx="10" class="box"/>
  <text x="320" y="270" class="h2">Cloud Run Job</text>
  <text x="320" y="292" class="mono">troupe-agent</text>

  <!-- window service -->
  <rect x="304" y="326" width="200" height="72" rx="10" class="swap"/>
  <text x="320" y="350" class="h2">Cloud Run Service</text>
  <text x="320" y="372" class="mono">troupe-window</text>
  <text x="320" y="390" class="sm" fill="#c2410c">replaced the desktop app</text>

  <!-- Cloud SQL -->
  <rect x="80" y="440" width="652" height="106" rx="10" class="swap"/>
  <text x="96" y="466" class="h2">Cloud SQL for PostgreSQL — the ledger</text>
  <text x="96" y="488" class="sm">jobs · job_events · rules · rule_events · results · evidence · questions · assessments</text>
  <text x="96" y="510" class="sm" fill="#c2410c">replaced a local SQLite file · append-only · nothing is overwritten or deleted</text>
  <text x="96" y="530" class="sm">both pulses and the window open it, read, write, and close — nothing is held between beats</text>

  <!-- Vertex -->
  <rect x="544" y="176" width="188" height="128" rx="10" class="swap"/>
  <text x="560" y="202" class="h2">Vertex AI</text>
  <text x="560" y="226" class="mono">gemini-3.5-flash</text>
  <text x="560" y="252" class="sm">reached through the</text>
  <text x="560" y="270" class="sm">Google GenAI SDK</text>
  <text x="560" y="294" class="sm" fill="#c2410c">replaced local Ollama</text>

  <!-- identity -->
  <rect x="544" y="326" width="188" height="72" rx="10" class="box"/>
  <text x="560" y="350" class="h2">Workload identity</text>
  <text x="560" y="372" class="mono">troupe-runtime</text>
  <text x="560" y="390" class="sm">Gemini and Cloud SQL trust it</text>

  <rect x="80" y="572" width="652" height="46" rx="10" class="box"/>
  <text x="96" y="592" class="h2">Secret Manager</text>
  <text x="240" y="592" class="sm">holds only the ledger connection string — nothing else is a secret, because nothing else is a key</text>

  <!-- arrows inside GCP -->
  <path class="flow" d="M256 212 H298"/>
  <path class="flow" d="M256 262 H298"/>
  <path class="flow" d="M504 275 H538"/>
  <path class="flow" d="M404 398 V434"/>

  <!-- ============ what runs inside the container ============ -->
  <rect x="800" y="122" width="584" height="516" rx="14" class="core"/>
  <text x="824" y="152" class="lbl">inside the image · dependencies point inward only</text>

  <rect x="824" y="176" width="536" height="70" rx="10" class="box"/>
  <text x="840" y="202" class="h2">ui · adapters</text>
  <text x="840" y="224" class="sm">the web window, the desktop window, the ledger, the anti-corruption layers. No business rules.</text>

  <rect x="864" y="266" width="456" height="70" rx="10" class="box"/>
  <text x="880" y="292" class="h2">app</text>
  <text x="880" y="314" class="sm">application services, ports, DTOs. Never business rules; never an outside tool.</text>

  <rect x="904" y="356" width="376" height="130" rx="10" class="box"/>
  <text x="920" y="382" class="h2">domain</text>
  <text x="920" y="404" class="sm">value objects · aggregates · invariants</text>
  <text x="920" y="424" class="sm">specifications · domain events · the state machine</text>
  <text x="920" y="450" class="sm">No clock, no randomness, no storage,</text>
  <text x="920" y="468" class="sm">no screens, no outside tools. "Now" arrives as an argument.</text>

  <path class="flow" d="M1092 246 V262"/>
  <path class="flow" d="M1092 336 V352"/>

  <rect x="824" y="512" width="536" height="106" rx="10" class="box"/>
  <text x="840" y="538" class="h2">Enforced, not agreed</text>
  <text x="840" y="560" class="sm">import-linter — 6 dependency contracts, checked every run</text>
  <text x="840" y="580" class="sm">reconciliation tests — the design tables and the code are compared line by line</text>
  <text x="840" y="600" class="sm">break_check — each of the 66 domain obligations is removed in turn; every one must go red</text>

  <!-- ============ the cycle ============ -->
  <rect x="56" y="670" width="1328" height="126" rx="14" class="box"/>
  <text x="80" y="700" class="lbl">one job, start to finish</text>
  <text x="80" y="732" class="t">a rule + the calendar → <tspan font-weight="650">create</tspan> → <tspan font-weight="650">hand out</tspan> → the agent arrives uncalled and <tspan font-weight="650">starts</tspan> → reads the source → asks Gemini</text>
  <text x="80" y="762" class="t">→ <tspan font-weight="650">submits a result, quoting the source as evidence</tspan> · or <tspan font-weight="650">asks the owner a question</tspan> · or <tspan font-weight="650">reports it is stuck</tspan> → a machine checks it against the criteria</text>
  <text x="80" y="786" class="sm">The model's word is never evidence. A result is finished only when a quote can be pulled from the source that backs it — and a human's answer does not count either.</text>

  <!-- human -->
  <rect x="56" y="820" width="672" height="86" rx="14" class="human"/>
  <text x="80" y="850" class="h2">What is left for the person</text>
  <text x="80" y="876" class="t">APPROVE · SEND BACK · ANSWER · ABANDON · agree/end a visit pattern</text>
  <text x="80" y="896" class="sm">the operations the design places on the human side of the line</text>

  <!-- claim -->
  <rect x="756" y="820" width="628" height="86" rx="14" class="swap"/>
  <text x="780" y="850" class="h2">What this submission demonstrates</text>
  <text x="780" y="874" class="t">Three pillars swapped — model, ledger, scheduler.</text>
  <text x="780" y="896" class="mono">git diff --stat baseline..pillars-swapped -- domain app  →  empty</text>
</svg>
